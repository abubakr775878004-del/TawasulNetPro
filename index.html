    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "TawasulNet Pro",
      "description": "نظام إدارة القروض والباقات المتكامل للموزعين"
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    
    <!-- نظام كشف الأخطاء وعرضها على الشاشة مباشرة بدلاً من الصفحة البيضاء -->
    <script>
      window.addEventListener('error', function(event) {
        document.body.innerHTML = '<div style="background: #222; color: #ff5555; padding: 25px; font-family: monospace; direction: ltr; text-align: left; word-break: break-all; margin: 20px; border-radius: 8px; border: 2px solid #ff5555;">' +
          '<h2 style="margin-top:0; color: #ff5555;">⚠️ Runtime Error Caught:</h2>' +
          '<p style="font-size: 16px; background: #000; padding: 10px; border-radius: 4px;">' + (event.message || 'Unknown error') + '</p>' +
          '<p><b>File:</b> ' + (event.filename || 'N/A') + '</p>' +
          '<p><b>Line:</b> ' + (event.lineno || 'N/A') + ' | <b>Column:</b> ' + (event.colno || 'N/A') + '</p>' +
        '</div>';
      });
      window.addEventListener('unhandledrejection', function(event) {
        document.body.innerHTML = '<div style="background: #222; color: #ff5555; padding: 25px; font-family: monospace; direction: ltr; text-align: left; word-break: break-all; margin: 20px; border-radius: 8px; border: 2px solid #ff5555;">' +
          '<h2 style="margin-top:0; color: #ff5555;">⚠️ Promise Rejection Error:</h2>' +
          '<p style="font-size: 16px; background: #000; padding: 10px; border-radius: 4px;">' + (event.reason ? (event.reason.stack || event.reason) : 'Unknown rejection') + '</p>' +
        '</div>';
      });
    </script>

    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
